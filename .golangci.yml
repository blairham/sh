# golangci-lint v2 configuration for sh.
# See: https://golangci-lint.run/usage/configuration/
#
# Rendered from blairham/.github baseline/golangci.yml.tmpl by `make sync`.
# Edit the baseline (or, with a reason, the override file
# overrides/sh.yml), not this file: the weekly drift check
# reports any difference.
#
# golangci-lint is pinned twice and the two must move together: go.mod's `tool`
# block (`go tool golangci-lint`) and the hook `rev` in .pre-commit-config.yaml.

version: "2"

run:
  timeout: 30m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true
  # Bounds the footprint: golangci-lint defaults to NumCPU.
  concurrency: 2

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true

linters:
  # The hook reports only what a commit introduces, so an older finding surfaces
  # when its lines are next touched: fix it then rather than adding a disable.
  enable:
    # Not yet enabled here — overrides/sh.yml says why. Adopt one
    # per pull request and shrink that list:
    #   whitespace
    #   unconvert
    #   unparam
    #   gocritic
    #   goconst
    #   revive
    #   bodyclose
    #   contextcheck
    #   rowserrcheck
    #   sqlclosecheck
    #   errname
    #   errorlint
    #   forcetypeassert
    #   nilerr
    #   nilnil
    #   noctx
    #   predeclared
    #   prealloc
    #   sloglint
    #   nestif
    #   funlen
    #   gocognit
    #   gocyclo
    #   thelper
    #   tparallel
    #   testableexamples
    #   importas
    #   interfacebloat
    #   wastedassign
    # Core linters (enabled by default)
    - errcheck # Check for unchecked errors
    - govet # Suspicious constructs; the analyzers are in settings
    - ineffassign # Detect ineffectual assignments
    - staticcheck # The staticcheck rule set
    - unused # Check for unused constants, variables, functions and types

    # Code quality and style
    - misspell # Commonly misspelled English words (US locale)

    # Bug detection

    # Performance

    # Security
    - gosec # Inspects source code for security problems

    # Code complexity

    # Testing

    # Import management

    # Interfaces

    # Memory

    # Beyond the baseline, for this repository (overrides/sh.yml)
    - forbidigo

  exclusions:
    rules:
      # Exclude test files from strict checks
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
          - funlen
          - gocognit
          - gocyclo
          - nestif
          - goconst # test fixtures legitimately repeat literals (JSON, expected values)
          - noctx # httptest.NewRequest et al. are test-only, not real HTTP calls

      # Allow init() in main packages
      - path: cmd/
        linters:
          - gocritic
        text: "initClause"

      # Only the library packages are embedded; the binaries own the process
      # and may touch its state.
      - path-except: ^(interp|dialect|repl)/
        linters:
          - forbidigo

      # Tests set up process state on purpose.
      - path: _test\.go$
        linters:
          - forbidigo

  settings:
    misspell:
      locale: US
      # Words this repository may spell as written (overrides/sh.yml).
      ignore-rules:
        - colour
        - cancelled

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G107 # URL provided to HTTP request as taint input
        - G204 # Subprocess launched with variable
        - G404 # Weak random number generator
        - G115 # Integer overflow conversion (safe when values are properly clamped)
        # Further rules this repository excludes (overrides/sh.yml).
        - G103
        - G301
        - G302
        - G304
        - G306
        - G602
        - G703

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    nestif:
      min-complexity: 5

    funlen:
      lines: 80
      statements: 50

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam # Noisy for SDK structs
        - rangeValCopy # Noisy for SDK structs
        - unnamedResult # Acceptable in some cases
        - paramTypeCombine # Explicit types can be clearer

    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable:
        - atomicalign
        - fieldalignment
        - nilness
        - reflectvaluecompare
        - shadow
        - timeformat
        - unusedwrite

    goconst:
      min-len: 3
      min-occurrences: 3

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Getwd$
          msg: the working directory is r.Dir; driver seeds it at construction
        - pattern: ^os\.Chdir$
          msg: moves every Runner in the process; `cd` moves only r.Dir
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: the environment is r.Env and r.Vars; driver seeds Env at construction
        - pattern: ^os\.(Setenv|Unsetenv|Clearenv)$
          msg: writes state every Runner in the process shares; write r.Vars or r.Env
        - pattern: ^syscall\.Exec$
          msg: replacing the process is the binary's decision; use the ReplaceProcess hook
        - pattern: ^exec\.LookPath$
          msg: consults the process's PATH and cwd; the Runner owns both — use lookpath.go
        - pattern: ^os\.Std(in|out|err)$
          msg: the three streams are r.Stdin/r.Stdout/r.Stderr, and a nil one is empty; driver wires all three at construction
        - pattern: ^os\.(TempDir|MkdirTemp|CreateTemp)$
          msg: os.TempDir is os.Getenv("TMPDIR"), and MkdirTemp/CreateTemp call it for an empty dir; the temporary home is r.tempHome() — TMPDIR through r.getVar

formatters:
  enable:
    # Not yet enabled here — overrides/sh.yml says why. Adopt one
    # per pull request and shrink that list:
    #   gofmt
    #   gci
    #   golines
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/blairham/sh

    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true

    gci:
      sections:
        - standard
        - default
        - prefix(github.com/blairham/sh)

    golines:
      max-len: 120
      tab-len: 1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
