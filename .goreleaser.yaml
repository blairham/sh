version: 2

# GoReleaser configuration for sh.
# See: https://goreleaser.com
#
# A release ships six binaries rather than one, because there are six shells:
# the substrate driver `sh` plus the five dialect binaries. They go into one
# archive per platform — a person installing this wants all of them, and the
# dialects are the same core with a different vector, so splitting them into
# six downloads would be six copies of one program.
project_name: sh

builds:
# Named binaries, plain. The name collision with the shells they model is the
# point — a shebang and `chsh` both name a shell by path, and `login` starts
# one as `-bash` — and the answer to the hazard is *where* they are installed,
# never a renaming that would break both. The Makefile's install target and the
# formula below agree on that: off PATH, named by their full path.
- id: sh
  binary: sh
  main: ./cmd/sh
  env:
  - CGO_ENABLED=0
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  ldflags:
  - -s -w
  # Only this binary has a `version` to stamp: it is what `-acp` reports to a
  # client. The dialect binaries tell a client nothing, so there is nothing to
  # write into them.
  - -X main.version={{.Version}}

- id: bash
  binary: bash
  main: ./cmd/bash
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  ldflags: [-s -w]

- id: zsh
  binary: zsh
  main: ./cmd/zsh
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  ldflags: [-s -w]

- id: ksh
  binary: ksh
  main: ./cmd/ksh
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  ldflags: [-s -w]

- id: dash
  binary: dash
  main: ./cmd/dash
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  ldflags: [-s -w]

- id: ash
  binary: ash
  main: ./cmd/ash
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  ldflags: [-s -w]

# No windows target. Every route into this program is a POSIX one — process
# groups, a controlling terminal, signals, `syscall.Exec` — and shipping a
# binary that cannot start is worse than shipping none.

archives:
- id: default
  formats: [tar.gz]
  # Matches `uname` for OS and architecture, as the other repositories here do,
  # so a downloader's own shell can build the name.
  name_template: >-
    {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
  files:
  - LICENSE
  - NOTICE
  - README.md
  - docs/install.md
  # The autoloadable functions one dialect ships. They are data rather than
  # code, so they are the same file on every platform, and they have to be in
  # the archive at the path the shell will look for them under: the search is
  # derived from where the binary sits, and `share/sh/functions` is the second
  # of the two directories it names. A release without them is a shell whose
  # `$fpath` points at nothing.
  - share/sh/functions/*

# macOS signing and notarization, matching the other repositories in this tree.
# Gated on isEnvSet, so a release still succeeds unsigned while the secrets are
# absent — which is the case here until they are added to this repository.
notarize:
  macos:
  - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
    ids: [sh, bash, zsh, ksh, dash, ash]
    sign:
      certificate: "{{.Env.MACOS_SIGN_P12}}"
      password: "{{.Env.MACOS_SIGN_PASSWORD}}"
    notarize:
      issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
      key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
      key: "{{.Env.MACOS_NOTARY_KEY}}"
      wait: true

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # **A first tag has no predecessor, so there is nothing to compare against
  # and the whole history becomes the changelog.** Measured on this tree at
  # v0.0.0: 1224 entries and 188,381 characters, against GitHub's limit of
  # 125,000 for a release body — so the release would have failed at the very
  # last step, with every artifact built and the tag already public. It is also
  # not a changelog anybody wants: "everything, since the beginning" is what a
  # first release means. The header in `release:` below is the note instead.
  disable: '{{ eq .PreviousTag "" }}'
  sort: asc
  use: github
  # `use: github` falls back to `git` whenever the compare is unavailable — a
  # first tag, a shallow clone — and git's default line carries the full 40
  # character SHA and the author's name and address. That is about ninety bytes
  # a line of what no reader asked for, and one copy of an email address per
  # commit on a public page; the subject already ends in its pull request
  # number, which is the link worth having.
  format: '{{ .Message }}'
  groups:
  # **Grouped by the subsystem each subject already names.** This tree does not
  # write conventional commits, and the `feat:`/`fix:` groups that used to be
  # here matched **zero of 1224** subjects — so every entry fell through to
  # "Other" and the two groups were decoration that read as curation. These
  # prefixes are the ones actually in use; run
  # `git log --format='%s' | sed -E 's/[:,].*//' | sort | uniq -c | sort -rn`
  # before changing them.
  - title: Dialects
    regexp: '^(bash|zsh|ksh|dash|ash|dialect)[,:]'
    order: 0
  - title: The interactive shell
    regexp: '^(repl|zle|blocks)[,:]'
    order: 1
  - title: The language and the interpreter
    regexp: '^(interp|syntax|expansion|pattern|arrays|declarations|traps|printer|diagnostics|driver)[,:]'
    order: 2
  - title: Other
    order: 999
  filters:
    exclude:
    # These are live, unlike the groups that used to sit above: 19 `docs:`,
    # 3 `test:` and 2 `chore:` on this tree. Checked rather than assumed —
    # the groups were not.
    - '^docs:'
    - '^test:'
    - '^chore:'

# A formula, like everything else in blairham/homebrew-tap — the tap has only
# Formula/. GoReleaser marks `brews` deprecated in favor of `homebrew_casks`,
# with no announced removal date; the reason to stay is the tap's shape, and a
# cask would also quarantine every binary it downloads, which for a shell means
# Gatekeeper refusing the thing `chsh` was just pointed at.
#
# **It installs nothing into `bin`, on purpose.** `bin.install "bash"` would put
# a file called `bash` in Homebrew's bin, which is ahead of /bin on the PATH of
# every machine that has Homebrew — so `brew install sh` would silently take
# over the system shells for every script on the machine, and undoing it would
# need the shell it had just replaced. Everything lands in the keg's libexec,
# which is off PATH, and the caveats say how to reach it. That is the same
# decision `make install` makes, for the same reason.
brews:
- name: sh
  repository:
    owner: blairham
    name: homebrew-tap
    token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
  directory: Formula
  homepage: https://github.com/blairham/sh
  description: A shell parser and interpreter in Go, with bash, zsh, ksh, dash and ash dialects
  license: Apache-2.0
  install: |
    # Every binary in the archive, `ash` included. An explicit list is what
    # dropped it once already: the archive carries all six, and
    # `libexec.install` silently skips the name it was not given, so the keg
    # came out missing a shell the caveats below promise by name.
    libexec.install "sh", "bash", "zsh", "ksh", "dash", "ash"
    # Not into libexec beside the binaries. The function search is
    # `<prefix>/share/sh/site-functions` then `<prefix>/share/sh/functions`,
    # and the prefix a binary in the keg's libexec derives is the keg — so
    # this is the directory the shell will actually look in, and
    # `share/sh/site-functions` is left for whatever a person installs later.
    (share/"sh").install "share/sh/functions"
  caveats: |
    The binaries are named bash, zsh, ksh, dash, ash and sh, so they are NOT linked
    into #{HOMEBREW_PREFIX}/bin — that would shadow the system shells for
    everything on this machine. They live here instead:

      #{opt_libexec}

    Run one by its full path:

      #{opt_libexec}/bash -i

    A session reads what a real shell of the same name reads, in the same order:
    the profile, the run-commands file, and the machine's own file in front of
    each. To use one as your login shell, add its full path to /etc/shells and
    then chsh to it — read this first, and keep the terminal you ran chsh in
    open until a new window works:

      https://github.com/blairham/sh/blob/main/docs/install.md
  test: |
    # One row per shipped binary. The list in `install:` above is explicit, so
    # a new dialect is installed only if somebody remembers to add it — these
    # rows are what turns forgetting into a failed release instead of a keg
    # that is quietly missing a shell.
    %w[sh bash zsh ksh dash ash].each do |shell|
      assert_equal "hi", shell_output("#{libexec}/#{shell} -c 'echo hi'").chomp
    end
    # The shipped functions are reachable from the default search, which is
    # the half a missing `files:` entry above would break silently: the shell
    # still starts, and every `autoload` in a real startup file fails at the
    # call instead.
    assert_equal "5.9", shell_output(
      "#{libexec}/zsh -f -c 'autoload -Uz is-at-least; is-at-least 5.0 5.9 && echo 5.9'"
    ).chomp

release:
  draft: false
  replace_existing_draft: true
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  mode: replace
  # The changelog is suppressed for a first tag — see `changelog:` above — so
  # this header is the whole of what a reader gets on the v0.0.0 page. It says
  # what the thing is, what it scored, and what is missing, in that order.
  header: |
    A shell parser, interpreter and formatter in Go. One core — the common
    denominator of real shells — with `bash`, `zsh`, `ksh`, `dash` and `ash`
    as presets over a semantics vector rather than forks of one another.

    **The first tag is `v0.0.0`, and it means it.** This is early, and
    breakage is expected.

    ### What is in the archive

    Six binaries: the substrate driver `sh`, and the five dialect binaries.
    They install into `libexec` and **never** into a `bin` directory — they
    are named after the shells they model, so a directory ahead of `/bin` on
    `PATH` would answer for every program on the machine that resolves a
    shell by name.

        brew install blairham/tap/sh

    ### Where it stands

    Each dialect graded against the real shell it models, over 3670 cases —
    `make conformance-dialects`:

    | binary | against | exact | behavioral |
    | --- | --- | --- | --- |
    | `bash` | bash 5.3.15 | 96% | **100%** |
    | `zsh` | zsh 5.9.2 | 98% | 99% |
    | `dash` | dash | 98% | **100%** |
    | `ksh` | ksh93 AJM 93u+ | 91% | 97% |
    | `ash` | BusyBox 1.37 ash | 79% | 97% |

    *Exact* is byte-identical stdout, stderr and status; *behavioral* allows a
    diagnostic to be worded differently when the status and output agree. The
    distance between the two columns is almost entirely message wording.

    ### What is not there yet

    The README's "What is not there yet" is the current list, and it is real.
    The sandbox contains the shell rather than the process tree; there is no
    Windows target; and diagnostic wording is the largest remaining gap.
  # `.PreviousTag` is empty for a first tag, which would render this as a
  # `compare/...v0.0.0` link that goes nowhere.
  footer: |
    {{ with .PreviousTag }}**Full Changelog**: https://github.com/blairham/sh/compare/{{ . }}...{{ $.Tag }}{{ end }}
