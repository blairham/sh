name: Pre-commit
on:
  pull_request:
    # `synchronize` is every push to a branch with an open pull request, which
    # is the feedback that matters — but only once the change is meant to be
    # looked at. A draft is work in progress, so nothing here runs for one;
    # `ready_for_review` starts it, and until then the local hooks are the
    # feedback. That is the whole trade: push freely while drafting, and the
    # gate runs when you say it is ready.
    types: [opened, reopened, synchronize, ready_for_review]
jobs:
  pre-commit:
    name: Pre-commit
    # The engineer's own hooks are the first line; this is the guarantee,
    # because a hook can be skipped and a contributor may not have installed
    # one at all.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
    - name: Run pre-commit hooks
      # Not the golangci-lint ones. The Lint job runs the same tool over the
      # whole repository rather than over the diff, and `golangci-lint run`
      # reports formatter findings too, so both hooks are a strict subset of
      # a job that already has to pass. Leaving them in took this job from
      # thirty seconds to three minutes to prove something twice.
      env:
        SKIP: golangci-lint,golangci-lint-fmt
      # check-license-headers is a golang-language hook, so pre-commit builds
      # it here; the version it runs is the `rev` pinned in
      # .pre-commit-config.yaml, which stays the single source of truth.
      uses: blairham/go-pre-commit@v4.6.6
