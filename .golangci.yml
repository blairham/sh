# golangci-lint v2 configuration for sh
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  settings:
    misspell:
      # US English, enforced rather than agreed. Prose drifts between the two
      # without anyone deciding to; this decides once, and the build says so
      # rather than a reviewer having to.
      locale: US
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  - misspell

formatters:
  enable:
  - gofumpt
  - goimports
  settings:
    goimports:
      local-prefixes:
      - github.com/blairham/sh
