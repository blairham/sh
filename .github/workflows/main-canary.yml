name: Main canary

# The one thing that still runs after a merge, and the reason it exists is
# recorded rather than assumed.
#
# Branch protection requires PR branches to be up to date before merging, so
# for a squash merge the tree that lands on main is the tree that was tested.
# That makes re-running lint and pre-commit here genuinely redundant: they are
# deterministic, and the input has not changed.
#
# Races are not deterministic. A test can pass on a branch and fail on main
# with the same tree, and it has: a Windows cleanup race in an earlier project
# was green on the branch of the pull request it first appeared after, and only
# a post-merge run caught it. So one cheap job stays — tests, one platform —
# rather than the full matrix, which is the compromise between "nothing runs
# after merge" and "everything runs twice".
#
# It is gated on Go changing for the same reason the pull-request jobs are: a
# merge that touched only documentation cannot have moved a race. Nothing here
# is a required check, so unlike those jobs this one can simply not run.
on:
  push:
    branches:
    - main

permissions:
  contents: read

concurrency:
  # Only the newest main matters; a queue of superseded runs teaches nobody.
  group: main-canary
  cancel-in-progress: true

jobs:
  test:
    name: Post-merge tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # Two commits: the merge and what it landed on, which is what the
        # diff below compares. A squash merge makes that a single commit.
        fetch-depth: 2
    - id: filter
      name: Did anything Go change?
      run: |
        if git diff --name-only HEAD^ HEAD | grep -qE '(\.go|^go\.mod|^go\.sum)$'; then
          echo "go=true" >> "$GITHUB_OUTPUT"
        else
          echo "go=false" >> "$GITHUB_OUTPUT"
          echo "No Go changed in this merge — nothing here could have moved a race."
        fi
    - uses: actions/setup-go@v6
      if: steps.filter.outputs.go == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
    - run: go test -race ./...
      if: steps.filter.outputs.go == 'true'
