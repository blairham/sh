version: 2

# GoReleaser configuration for sh.
# See: https://goreleaser.com
#
# A release ships seven binaries rather than one. Six of them are shells — the
# substrate driver `sh` plus the five dialect binaries — and the seventh is
# `shfmt`, which reads with the same parser and lays out in the same dialect
# styles. They go into one archive per platform: a person installing this
# wants all of them, and they are the same core with a different vector, so
# splitting them into seven downloads would be seven copies of one program.
project_name: sh

builds:
  # Named binaries, plain. The name collision with the shells they model is the
  # point — a shebang and `chsh` both name a shell by path, and `login` starts
  # one as `-bash` — and the answer to the hazard is *where* they are installed,
  # never a renaming that would break both. The Makefile's install target and the
  # formula below agree on that: off PATH, named by their full path.
  - id: sh
    binary: sh
    main: ./cmd/sh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      # Every binary has a `version` to stamp, and this comment used to say the
      # opposite: "only this binary ... the dialect binaries tell a client nothing".
      # That was true while `-acp` lived on cmd/sh alone. Since #2585 every shipped
      # binary serves the protocol, so every one of them tells a client what it is,
      # and one left unstamped would announce 0.0.0-dev out of a tagged release.
      - -X main.version={{.Version}}

  - id: bash
    binary: bash
    main: ./cmd/bash
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: zsh
    binary: zsh
    main: ./cmd/zsh
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: ksh
    binary: ksh
    main: ./cmd/ksh
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: dash
    binary: dash
    main: ./cmd/dash
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: ash
    binary: ash
    main: ./cmd/ash
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: shfmt
    binary: shfmt
    main: ./cmd/shfmt
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      # Stamped like the six above, though this one serves no protocol. A tool a
      # person runs by hand is asked what it is by a person, so it grew a
      # `-version` flag in the same change that started shipping it; an unstamped
      # binary would answer `0.0.0-dev` out of a tagged release, which is the
      # failure the note on `cmd/sh` above describes.
      - -X main.version={{.Version}}

# No windows target. Every route into this program is a POSIX one — process
# groups, a controlling terminal, signals, `syscall.Exec` — and shipping a
# binary that cannot start is worse than shipping none.

archives:
  - id: default
    formats: [tar.gz]
    # Matches `uname` for OS and architecture, as the other repositories here do,
    # so a downloader's own shell can build the name.
    name_template: >-
      {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      - docs/install.md
      # The autoloadable functions one dialect ships. They are data rather than
      # code, so they are the same file on every platform, and they have to be in
      # the archive at the path the shell will look for them under: the search is
      # derived from where the binary sits, and `share/sh/functions` is the second
      # of the two directories it names. A release without them is a shell whose
      # `$fpath` points at nothing.
      - share/sh/functions/*

# macOS signing and notarization, matching the other repositories in this tree.
# Gated on isEnvSet, so a release still succeeds unsigned while the secrets are
# absent — which is the case here until they are added to this repository.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [sh, bash, zsh, ksh, dash, ash, shfmt]
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

checksum:
  name_template: 'checksums.txt'

# Keyless cosign signatures, from the release workflow's own GitHub identity:
# no key to store or leak, and the certificate names the exact workflow and tag
# that produced the release. Signing checksums.txt covers every archive, since
# it lists each one's digest. See SECURITY.md for how to verify. A `--snapshot`
# render does NOT skip this on its own, so CI's packaging job passes
# `--skip=sign` -- it has no OIDC token to sign with.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# **The published notes are the tag's section of CHANGELOG.md**, which
# release-please writes from each pull request's Conventional Commit title.
# go-release.yml hands that section to GoReleaser as `--release-notes`, which
# skips this stage's own list, so nothing here shapes a published release.
# Never set `disable`: it also skips the stage that reads `--release-notes`.
#
# The subsystem groups that used to be here are gone with the subjects they
# matched (`interp: …` is now `fix(interp): …`), and CHANGELOG.md groups by
# type instead. What is left is for a snapshot: `use: github` falls back to
# `git` whenever the compare is unavailable, and git's default line carries
# the full SHA and the author's name and address, where the subject already
# ends in its pull request number.
changelog:
  sort: asc
  use: github
  format: '{{ .Message }}'

# A formula, like everything else in blairham/homebrew-tap — the tap has only
# Formula/. GoReleaser marks `brews` deprecated in favor of `homebrew_casks`,
# with no announced removal date; the reason to stay is the tap's shape, and a
# cask would also quarantine every binary it downloads, which for a shell means
# Gatekeeper refusing the thing `chsh` was just pointed at.
#
# **It puts no shell into `bin`, on purpose.** `bin.install "bash"` would put a
# file called `bash` in Homebrew's bin, which is ahead of /bin on the PATH of
# every machine that has Homebrew — so `brew install sh` would silently take
# over the system shells for every script on the machine, and undoing it would
# need the shell it had just replaced. All six land in the keg's libexec, which
# is off PATH, and the caveats say how to reach it. That is the same decision
# `make install` makes, for the same reason.
#
# `shfmt` is the exception and does go into `bin` — see the note on
# `bin.install "shfmt"` below. The rule is about names resolved *implicitly*,
# and nothing resolves a formatter that way.
brews:
  - name: sh
    repository:
      owner: blairham
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/blairham/sh
    description: A shell parser, interpreter and formatter in Go, with bash, zsh, ksh, dash and ash dialects
    license: Apache-2.0
    # See the note on `bin.install "shfmt"` below. Declared rather than left to
    # Homebrew's symlink failure, so the error names the other formula.
    conflicts: [shfmt]
    install: |
      # Every shell in the archive, `ash` included. An explicit list is what
      # dropped it once already: the archive carries all six, and
      # `libexec.install` silently skips the name it was not given, so the keg
      # came out missing a shell the caveats below promise by name.
      libexec.install "sh", "bash", "zsh", "ksh", "dash", "ash"
      # **`shfmt` goes into `bin`, and it is the one binary here that should.**
      # The rule above is about names that are *resolved implicitly*: a `bash`
      # ahead of `/bin` on PATH answers for every shebang, every `system()` and
      # every `chsh` on the machine. Nothing resolves a formatter that way — it
      # is only ever called by name, on purpose, by an editor, a pre-commit hook
      # or a Makefile, and every one of those is a caller that cannot be handed
      # a keg-internal path. A formatter behind `opt_libexec` is a formatter
      # nothing calls.
      #
      # The real hazard is the other formula: homebrew-core ships mvdan.cc/sh's
      # `shfmt`, which wants the same `bin/shfmt`. `conflicts:` below declares
      # that, so Homebrew refuses with a sentence naming both formulas instead
      # of the bare "Could not symlink bin/shfmt" that silence produces.
      bin.install "shfmt"
      # Not into libexec beside the binaries. The function search is
      # `<prefix>/share/sh/site-functions` then `<prefix>/share/sh/functions`,
      # and the prefix a binary in the keg's libexec derives is the keg — so
      # this is the directory the shell will actually look in, and
      # `share/sh/site-functions` is left for whatever a person installs later.
      (share/"sh").install "share/sh/functions"
    caveats: |
      The binaries are named bash, zsh, ksh, dash, ash and sh, so they are NOT linked
      into #{HOMEBREW_PREFIX}/bin — that would shadow the system shells for
      everything on this machine. They live here instead:

        #{opt_libexec}

      Run one by its full path:

        #{opt_libexec}/bash -i

      The formatter is the exception and IS on your PATH as `shfmt`, because an
      editor or a pre-commit hook can only call it by name:

        shfmt -w script.sh

      homebrew-core ships a different `shfmt` (mvdan.cc/sh). Only one of the two
      can own that name, so this formula declares the conflict rather than
      failing at the symlink.

      A session reads what a real shell of the same name reads, in the same order:
      the profile, the run-commands file, and the machine's own file in front of
      each. To use one as your login shell, add its full path to /etc/shells and
      then chsh to it — read this first, and keep the terminal you ran chsh in
      open until a new window works:

        https://github.com/blairham/sh/blob/main/docs/install.md
    test: |
      # One row per shipped binary. The list in `install:` above is explicit, so
      # a new dialect is installed only if somebody remembers to add it — these
      # rows are what turns forgetting into a failed release instead of a keg
      # that is quietly missing a shell.
      %w[sh bash zsh ksh dash ash].each do |shell|
        assert_equal "hi", shell_output("#{libexec}/#{shell} -c 'echo hi'").chomp
      end
      # The formatter is a seventh binary rather than a seventh shell, so it is
      # not in the list above and needs its own row — and a `-c` probe would not
      # have caught it, since `shfmt` does not take one. Laying out a script it
      # has to reparse is the cheapest end-to-end check that the parser, the
      # dialect style and the printer all made it into the keg.
      assert_equal "if true; then\n  echo hi\nfi",
        pipe_output("#{bin}/shfmt -dialect bash", "if true;then\necho hi\nfi\n", 0).chomp
      assert_match version.to_s, shell_output("#{bin}/shfmt -version")

      # The shipped functions are reachable from the default search, which is
      # the half a missing `files:` entry above would break silently: the shell
      # still starts, and every `autoload` in a real startup file fails at the
      # call instead.
      #
      # **`env -u FPATH` is what makes this row discriminating**, and without it
      # the row was decoration. An `FPATH` in the environment *replaces* the
      # default search rather than adding to it (driver/functiondirs.go), so on
      # any machine whose own zsh exported one — a CI runner with oh-my-zsh, a
      # maintainer's laptop — `is-at-least` was loading out of
      # /usr/share/zsh/5.9/functions and the row passed against a keg that
      # shipped no functions at all. Unset, `$fpath` is exactly the keg's two
      # directories, and deleting the shipped copy fails the row.
      assert_equal "5.9", shell_output(
        "/usr/bin/env -u FPATH #{libexec}/zsh -f -c " \
        "'autoload -Uz is-at-least; is-at-least 5.0 5.9 && echo 5.9'"
      ).chomp

release:
  draft: false
  replace_existing_draft: true
  # No target_commitish: the tag already exists, and naming a commit makes
  # GitHub treat the release as a ref write. When the release range touches
  # .github/workflows, that needs the workflows permission GITHUB_TOKEN
  # cannot have, and creating the release fails with a 403.
  prerelease: auto
  mode: replace
  # This header sits above the tag's CHANGELOG.md section. It stays because a
  # changelog says what moved and never what the thing is: this says what it is,
  # what it scored, and what is missing, in that order. Keep it version-agnostic
  # so a tag needs no edit here; the table and the case count are the exceptions.
  # They are the README's table, copied with its date: when that one is
  # re-measured, this one moves in the same change, or the release page goes on
  # quoting a figure the README has already retired.
  header: |
    A shell parser, interpreter and formatter in Go. One core — the common
    denominator of real shells — with `bash`, `zsh`, `ksh`, `dash` and `ash`
    as presets over a semantics vector rather than forks of one another.

    **This is a `0.x` tag and means it.** Early, and breakage is expected.
    What changed since the last tag is the changelog below.

    ### What is in the archive

    Seven binaries: the substrate driver `sh`, the five dialect binaries, and
    `shfmt`, which lays a script out in whichever dialect it was written in.
    They install into `libexec` and **never** into a `bin` directory — the
    shells are named after the shells they model, so a directory ahead of
    `/bin` on `PATH` would answer for every program on the machine that
    resolves a shell by name, and `shfmt` stays out of `bin` so that
    homebrew-core's formula of the same name can still be installed.

        brew install blairham/tap/sh

    ### Where it stands

    Each dialect graded against the real shell it models, on macOS against the
    golden record `make oracle` writes, 2026-10-04, 4488 cases each:

    | binary | against | exact | behavioral |
    | --- | --- | --- | --- |
    | `bash` | bash 5.3.20 | 99.8% | 99.8% |
    | `zsh` | zsh 5.9.2 | 99.8% | 99.8% |
    | `dash` | dash | 99.9% | 99.96% |
    | `ksh` | ksh93 AJM 93u+ | 99.1% | 99.5% |
    | `ash` | BusyBox 1.37 ash | 99.5% | 99.6% |

    *Exact* is byte-identical stdout, stderr and status; *behavioral* allows a
    diagnostic to be worded differently when the status and standard output
    agree. Every case still short of exact is listed per dialect in
    `internal/oracle/testdata/conformance/` with a written reason, and CI
    fails a change that adds to a list.

    ### What is not there yet

    The README's "What is not there yet" is the current list, and it is real.
    The sandbox contains the shell rather than the process tree, and there is
    no Windows target. Diagnostic wording is a long tail rather than the
    headline gap: a bounded sample of twenty everyday error situations — a
    missing command, `cd` onto a file, a redirect that cannot open, an unknown
    option to six builtins — comes back byte-identical on standard error *and*
    exit status for every one of the five, 100 of 100 on 2026-09-27. The probe
    is `internal/cmd/diagsample` and takes a few seconds a column, so this line
    can be re-measured rather than inherited.
  # `.PreviousTag` is empty for a first tag, which would render this as a
  # `compare/...v0.0.0` link that goes nowhere.
  footer: |
    {{ with .PreviousTag }}**Full Changelog**: https://github.com/blairham/sh/compare/{{ . }}...{{ $.Tag }}{{ end }}
