name: Release

# A `v*` tag is the whole trigger, which is this tree's release convention:
# green CI on main → tag → this workflow → the tap is updated. `workflow_dispatch`
# re-runs a tag that already exists, for the case where the release job itself
# failed and nothing about the tree needs to change.
on:
  push:
    tags:
    - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.0). Must already exist."
        required: true
        type: string

# Read-only by default; the one job that publishes asks for what it writes.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release and its assets
      # The six container images go to ghcr.io in the same run -- see
      # `dockers_v2` in `.goreleaser.yaml`. The token below writes them.
      packages: write
      # Keyless cosign: the OIDC token is the signing identity -- see `signs`
      # and `docker_signs` in `.goreleaser.yaml`.
      id-token: write
      # SLSA build provenance for the archives -- see "Attest build provenance".
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # GoReleaser reads the tag history to build a changelog, so a shallow
        # checkout gives it nothing to compare against.
        fetch-depth: 0

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: false # replaced by the release-scoped cache below

    # Release-scoped Go cache. setup-go's built-in cache is an exact match on
    # go.sum and is saved by the CI test jobs, which build for the host platform
    # only; this one falls back on a prefix and is saved after goreleaser has
    # run, so it warms every cross-compiled GOOS/GOARCH pair.
    - name: Restore release Go cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-release-${{ runner.os }}-

    - name: Checkout tag (workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      run: git checkout "refs/tags/${{ inputs.tag }}"

    # The tests, and only the tests. `make check` would also run the oracle,
    # which needs the shell panel this runner does not have and grades against
    # a record made on another machine — see AGENTS.md for why that is
    # report-only in CI. A release must not fail on it.
    - name: Run tests
      run: make test

    # **The one builder that can do this.** `dockers_v2` builds both
    # architectures in a single `docker buildx build --platform
    # linux/amd64,linux/arm64 --push`, and a runner's default builder is the
    # `docker` driver, which cannot export a manifest list. This action makes a
    # `docker-container` builder, which can. No QEMU beside it: the recipe pins
    # its assembly stage to `$BUILDPLATFORM`, so nothing foreign is executed
    # while the image is built.
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # GoReleaser builds and pushes the container images itself, so it needs a
    # registry it is already logged in to. ghcr.io takes the run's own token,
    # which is scoped to this repository by `packages: write` above -- nothing
    # extra to store.
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Log in to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

    # SLSA build provenance for every archive, signed through the same OIDC
    # identity as the cosign signatures and recorded in GitHub's attestation
    # store, so `gh attestation verify <archive> --repo blairham/sh` works.
    # checksums.txt names every archive by digest, so one statement covers them
    # all.
    - name: Attest build provenance
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: dist/checksums.txt

    # The same bundle as a release asset. OpenSSF Scorecard's Signed-Releases
    # check finds provenance by an .intoto.jsonl asset on the release; it does
    # not read the attestation store. jq -c makes the bundle one JSON line.
    - name: Upload provenance to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        jq -c . "$BUNDLE" > sh.intoto.jsonl
        gh release upload "$TAG" sh.intoto.jsonl --clobber

    # The published index, pulled back and run. CI's `packaging` job smokes the
    # same six images on every pull request that touches the recipe, but it
    # builds them with `--snapshot`, which never creates the **multi-platform
    # index** -- it loads one image per architecture and stops. The index is
    # made here and nowhere else, so this is the only place a broken one can be
    # caught. One architecture is enough for that: if the index were wrong, the
    # runner's own pull is what would fail.
    - name: Does the published index run?
      run: |
        set -euo pipefail

        # The roster comes out of the render that just ran, not a list written
        # here: a list is a claim about a roster it cannot see, and says nothing
        # when a seventh image is added. `:latest` is dropped because it is the
        # same digest as the version tag one line above it.
        mapfile -t images < <(
          jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json \
            | grep -v ':latest$' | sort -u
        )
        if [ "${#images[@]}" -eq 0 ]; then
          echo "::error::the release produced no container images -- this step proved nothing"
          exit 1
        fi

        err=$(mktemp)
        status=0
        for img in "${images[@]}"; do
          name=${img%:*}; name=${name##*/}
          # Nothing local: the tag is pulled back from the registry, so this
          # answers for the index that was published rather than for anything
          # the build left in the runner's image store.
          docker rmi -f "$img" >/dev/null 2>&1 || true
          # stderr separately, not folded in: `docker run` writes the pull's
          # progress and any platform note there, and a comparison that read it
          # would fail on output the shell never produced. See the same note in
          # the CI job this mirrors.
          got=$(docker run --rm "$img" -c 'echo $0' 2>"$err") || true
          if [ "$got" != "/bin/$name" ]; then
            echo "::error::$img answered [$got], wanted [/bin/$name]"
            sed 's/^/    /' "$err"
            status=1
          else
            echo "$img: ok"
          fi
        done
        exit "$status"
