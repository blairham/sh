# golangci-lint v2 configuration for sh
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  # Several worktrees of this module are linted at once, and by default the
  # second one to start refuses outright: golangci-lint takes a file lock and
  # gives up after five seconds with "parallel golangci-lint is running". The
  # pre-commit hook inherits that, so a *commit* fails for a reason that has
  # nothing to do with the commit.
  #
  # The lock is `$TMPDIR/golangci-lint.lock` — it is not inside the cache
  # directory, so pointing GOLANGCI_LINT_CACHE somewhere per-worktree does not
  # move it and does not help. Two runs with private cold caches still collide.
  #
  # The lock exists to serialise writers to the shared cache, and the cache no
  # longer needs it. Its keys are hashed over module-relative paths and the
  # issues it stores carry module-relative positions that are re-anchored on
  # read, so an entry written by one checkout is correct for another; the store
  # underneath is the Go build cache format, which is written by atomic rename
  # and is designed for concurrent use. Four runs across two worktrees against
  # one cold shared cache agree exactly.
  #
  # Sharing the cache is also the point. A checkout that shares a warm one
  # lints in 0.7s; the same checkout with a private cold cache takes 37s —
  # which is both the 54x tax a per-worktree cache would charge every new
  # worktree, and the reason the five-second lock timeout was ever reached.
  allow-parallel-runners: true
  # And a cap on how much of the machine each of those parallel runners takes.
  # golangci-lint defaults its internal parallelism to every CPU, so on an
  # 18-core machine one run asks for all 18 — and with allow-parallel-runners
  # above, several agents committing at once ask for 18 each. Measured: two
  # concurrent runs at 260% and 884% CPU, 3GB resident apiece, 63% of the
  # machine's total CPU spent linting while everything else waited. A commit
  # is not the only thing happening on a developer's laptop.
  #
  # Four is chosen so that the realistic worst case stays near the core count
  # rather than five times over it, and because the tax is small: linting is
  # dominated by loading and typechecking the package graph, which is where
  # the shared warm cache above already does the work. CI runners have fewer
  # cores than this anyway, so it changes nothing there.
  concurrency: 4

linters:
  settings:
    misspell:
      # US English, enforced rather than agreed. Prose drifts between the two
      # without anyone deciding to; this decides once, and the build says so
      # rather than a reviewer having to.
      locale: US
    forbidigo:
      # interp/ is a library and may not touch — or consult — process-wide
      # state. A Runner is embedded in other programs, several to a process,
      # and everything these calls read or write is shared by all of them:
      # the answer belongs on the Runner (r.Dir, r.Env, r.Vars) or behind a
      # hook the binary fills in (ReplaceProcess). AGENTS.md states the rule;
      # this enforces it, because os.Getwd once sat in the glob path of every
      # shipped binary with nothing to say so — and then os.MkdirTemp("")
      # did the same thing in the process-substitution path, because the
      # empty first argument is os.TempDir is os.Getenv("TMPDIR"), and no
      # pattern here named it. A guard is only as wide as its list.
      #
      # Scoped by the exclusions below to interp/ *and* dialect/. A dialect
      # is library code too: an embedder links it and Apply runs inside the
      # Runner, so an os.Getenv landing there is the same leak in a
      # directory the rule used not to cover.
      #
      # The three streams are on the list for the same reason and are the
      # sharpest case, because they are the one piece of process state a
      # library *writes*. A nil Stdout used to fall back to os.Stdout, which
      # meant an embedder who wired two of the three had a script's output
      # appearing in the host program's terminal with nothing to say where
      # it came from — while a nil Env was already empty and Dir already
      # refused to ask os.Getwd. Nil now means empty for all three, and this
      # entry is what keeps it that way: there is no nolint anywhere under
      # interp/ or dialect/, because after that change there is nothing left
      # to bless.
      #
      # Reading the process's *identity* is not on this list and is not
      # meant to be. A pid, a uid, a euid are per-process but they are not
      # state anyone can fight over — two Runners in one program genuinely
      # share them, nothing a script does can change them, and $$, $UID and
      # $EUID need them. dialect/bash and dialect/zsh read uid for exactly
      # that and are correct.
      analyze-types: true
      forbid:
      - pattern: ^os\.Getwd$
        msg: the working directory is r.Dir; driver seeds it at construction
      - pattern: ^os\.Chdir$
        msg: moves every Runner in the process; `cd` moves only r.Dir
      - pattern: ^os\.(Getenv|LookupEnv|Environ)$
        msg: the environment is r.Env and r.Vars; driver seeds Env at construction
      - pattern: ^os\.(Setenv|Unsetenv|Clearenv)$
        msg: writes state every Runner in the process shares; write r.Vars or r.Env
      - pattern: ^syscall\.Exec$
        msg: replacing the process is the binary's decision; use the ReplaceProcess hook
      - pattern: ^exec\.LookPath$
        msg: consults the process's PATH and cwd; the Runner owns both — use lookpath.go
      - pattern: ^os\.Std(in|out|err)$
        msg: the three streams are r.Stdin/r.Stdout/r.Stderr, and a nil one is empty; driver wires all three at construction
      - pattern: ^os\.(TempDir|MkdirTemp|CreateTemp)$
        msg: os.TempDir is os.Getenv("TMPDIR"), and MkdirTemp/CreateTemp call it for an empty dir; the temporary home is r.tempHome() — TMPDIR through r.getVar
  enable:
  - errcheck
  - forbidigo
  - govet
  - ineffassign
  - staticcheck
  - unused
  - misspell
  exclusions:
    rules:
    # The purity rule guards the library, so it applies where the library
    # lives — which is interp/ *and* dialect/. A dialect package is not a
    # front end: an embedder imports it and its Apply runs inside the
    # Runner, so process state read there is read on the library's side of
    # the line, and only the exclusion's old shape made that lint clean.
    # driver and the binaries are the intended home of these calls, and
    # interp's own tests are embedders — a test may legitimately read the
    # real PATH to find the real /bin/echo, or point TMPDIR somewhere it
    # can watch.
    - path-except: ^(interp|dialect)/
      linters:
      - forbidigo
    - path: _test\.go$
      linters:
      - forbidigo

formatters:
  enable:
  - gofumpt
  - goimports
  settings:
    goimports:
      local-prefixes:
      - github.com/blairham/sh
