# Pre-commit configuration for sh
# Install: pre-commit install
# Run:     pre-commit run --all-files
# Update:  pre-commit autoupdate

repos:
# General hygiene
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  # These two rewrite in place, so they are the hooks that can still change a
  # file between the check you ran and the commit object that lands (#1267).
  # The generated record is held out of both: it has to stay byte-for-byte
  # what `make oracle` wrote, and a hook tidying it desyncs it from the corpus
  # that generated it.
  - id: trailing-whitespace
    exclude: ^(internal/oracle/testdata/golden\.json|docs/spec/measurements\.md)$
  - id: end-of-file-fixer
    exclude: ^(internal/oracle/testdata/golden\.json|docs/spec/measurements\.md)$
  - id: check-yaml
  - id: check-added-large-files
  - id: detect-private-key

# Go housekeeping
- repo: https://github.com/TekWizely/pre-commit-golang
  rev: v1.0.0-rc.4
  hooks:
  - id: go-mod-tidy-repo

  # golangci-lint at commit time, run as `go tool` so the version comes from
  # go.mod's tool block -- the same binary the Lint job uses. The upstream
  # golangci-lint hooks download one of their own, which is a second pin to
  # keep in step and a formatter that can disagree with CI.
  #
  # `fmt --diff` reports gofumpt and goimports drift without rewriting, for
  # the #1267 reason above. `-l -d` gofumpt used to do half of this; the
  # formatters block in .golangci.yml is the other half, and this covers both.
  - id: my-cmd-repo
    alias: golangci-lint-fmt
    name: golangci-lint fmt
    args: [--hook:error-on-output, go, tool, golangci-lint, fmt, --diff]

  # `--new-from-rev HEAD` reports what this commit introduces rather than the
  # repository's backlog. It filters *output* only: golangci type-checks the
  # whole module either way, so this buys signal, not seconds. The whole-tree,
  # enforced run is the Lint job in CI, which is the required check -- and the
  # only one that ever examines `main` (#1302, #1640).
  - id: my-cmd-repo
    alias: golangci-lint
    name: golangci-lint
    args: [go, tool, golangci-lint, run, --new-from-rev, HEAD]

# US English over prose, which is where most of this repository is.
# .golangci.yml sets locale: US, but golangci-lint reaches Go files and
# nothing else, so docs/ was outside the rule AGENTS.md cites it for (#541).
- repo: https://github.com/golangci/misspell
  rev: v0.8.0
  hooks:
  - id: misspell
    args: [-locale, US, -i, "colour,cancelled", -error]
    files: \.(md|ya?ml)$
    exclude: ^docs/spec/measurements\.md$

# Secret scanning
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks

# check-conflict-markers, not upstream's check-merge-conflict: upstream knows
# only git's three default markers, so the `|||||||` a diff3 merge writes goes
# unreported, and without --assume-in-merge it does not scan outside a merge
# at all. A diff3 base marker lived in the spec for weeks and was found by eye.
- repo: https://github.com/blairham/pre-commit-hooks
  rev: v0.4.0
  hooks:
  - id: check-license-headers
    args: [--license, Apache-2.0]
  - id: check-go-version-sync
  - id: check-conflict-markers
  - id: go-vulncheck
