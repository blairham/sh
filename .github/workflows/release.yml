name: Release

# A `v*` tag is the whole trigger, which is this tree's release convention:
# green CI on main → tag → this workflow → the tap is updated. The release
# itself is blairham/.github's go-release.yml: the tests, GoReleaser (one
# archive per platform carrying all six binaries, and the Homebrew formula),
# keyless cosign over checksums.txt (`signs` in .goreleaser.yaml), and SLSA
# build provenance for the archives. The signing
# identity is go-release.yml itself; SECURITY.md shows how to verify it.
#
# `workflow_dispatch` re-runs a tag that already exists, for the case where
# the release job itself failed and nothing about the tree needs to change,
# or renders a dry run with nothing published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.0). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; the jobs that publish ask for what they write.
permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign and the provenance attestations both sign with the
      # workflow's OIDC identity.
      id-token: write
      attestations: write
    uses: blairham/.github/.github/workflows/go-release.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      # No CHANGELOG.md here (overrides/sh.yml in blairham/.github): the notes
      # are GoReleaser's, shaped by `changelog:` and `release.header` in
      # .goreleaser.yaml.
      release-notes: generated
      # A build, not the tests. A tag only ever goes on a `main` commit whose CI
      # run is already green, so re-running `go test -race ./...` here repeated
      # that run on the same tree and was about 12 of a release's 25 minutes --
      # `interp` alone passed go test's 10m package timeout at v0.0.37. The
      # gate for a release is CI on the tagged commit; this only confirms the
      # module compiles before GoReleaser starts.
      test-command: go build ./...
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
