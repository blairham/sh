name: license

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headers:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every Go file carries an SPDX header
        run: ./scripts/check-headers.sh
