name: CI

# One workflow holds everything that gates a merge, so there is one file to
# read and one check to require. Splitting pre-commit or tests into their own
# workflow bought nothing and cost a second place to keep in sync.
on:
  pull_request:
    # `synchronize` is every push to a branch with an open pull request, which
    # is the feedback that matters. A draft is treated exactly like any other
    # pull request: the distinction bought a little runner time and cost a
    # second set of rules to hold in your head.
    types: [opened, reopened, synchronize, ready_for_review]
    # Nothing here fires for a push to a branch with no pull request open, so
    # branch pushes cost nothing at all.
  push:
    # A merge runs the same full set a pull request runs — pre-commit, tests,
    # oracle, no change detection. Protection makes the tree that lands the
    # tree that was tested, so this is not about the merge; it is about
    # whether main still works after everything that reached it, including
    # merges that landed after this branch was last rebased and were never
    # tested together. That is the only run that can catch it.
    branches: [main]

permissions:
  contents: read

concurrency:
  # A superseded push to a pull request is not worth finishing; only the
  # newest commit on that branch matters, so its run replaces the one before.
  #
  # A push to main is the opposite case. main is not a branch anyone is
  # iterating on: every merge is a *different* change, and the run it starts
  # is the only verification that commit will ever get — the pull request was
  # tested against its merge base, not against the tree the squash produced.
  # Canceling it discards the answer rather than a stale one. Keying main's
  # group on the commit gives every merge a group of its own, so there is
  # nothing to cancel it and nothing for it to queue behind; a pull request
  # ref is already unique per pull request, so it keeps superseding itself.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

jobs:
  # Runs for every commit that reaches GitHub — every push to a pull request,
  # draft or not, and every push to main. It is the only job that looks at
  # *every* file rather than at Go: trailing whitespace, license headers,
  # secrets, the toolchain pin. None of that is worth detecting changes for,
  # and a secret committed to a draft is committed.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true # go-mod-tidy-repo resolves the whole graph; an uncached run is slow and flaky # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
    - name: Run pre-commit hooks
      # golangci-lint is no longer among these hooks -- see
      # .pre-commit-config.yaml for why, and the Lint job below for where it
      # went. Everything else here still runs on every commit.
      uses: blairham/go-pre-commit@v4.6.6

  # golangci-lint, in a job of its own, because it does not belong at `git
  # commit` time: it type-checks the whole module and cost ~3GB and 300% CPU
  # per run on a developer's machine.
  #
  # **The whole tree, every run.** This used to be `--new-from-merge-base`, so
  # that a pull request was graded on its own diff and not blocked by debt it
  # did not introduce. The cost of that was invisible in exactly the direction
  # that matters: on `main` the merge base *is* HEAD, so the diff is empty and
  # the run examines nothing, and from the moment a finding lands through a
  # merge nothing reports it ever again. Five accumulated that way and were
  # found by hand rather than by CI (#1640), and a linter that failed on a
  # clean checkout for reasons that were nobody's is what taught people to
  # discount it (#1302).
  #
  # A diff-scoped run also fails silently in the green direction. golangci-lint
  # prints `0 issues` and exits 0 when the base ref does not resolve -- a
  # shallow clone, a renamed base -- so the check that is meant to be strictest
  # is the one that passes when it is broken. A full-tree run has no such mode:
  # it either examines the tree or it errors.
  #
  # What this trades away is that inherited debt now does block a pull request.
  # That is affordable only because the tree is clean, and keeping it clean is
  # the point; if a finding lands anyway, the answer is to fix it rather than
  # to narrow the run again.
  #
  # No `fetch-depth: 0` any more: nothing here computes a merge base, so the
  # default shallow checkout is enough and is faster.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - name: Is the whole tree clean?
      run: go tool golangci-lint run

  # Gating happens inside the jobs, never with a workflow-level `paths:`
  # filter: a required check that never runs reports as *pending forever*
  # rather than as passed, which makes a docs-only pull request unmergeable.
  # Anything unrecognized counts as code, so when this is wrong it is wrong in
  # the direction of running the tests.
  # Only after the cheap universal checks have passed is it worth asking the
  # expensive question, so this waits on pre-commit.
  changes:
    name: Detect changed files
    needs: pre-commit
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    # Gated per step, not on the job. A required check that never runs is
    # reported as pending forever, and a matrix job skipped by `if:` never
    # expands at all — so the job always runs and reports, and only the
    # expensive steps are skipped.
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # the diff needs the base commit, not just HEAD
    - id: filter
      name: Is any of this code?
      env:
        # A pull request diffs against its base; a push to main diffs against
        # what main was before it. Either can be missing — a force push, a
        # first commit — and the fallback below covers that.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=false
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          # A merge runs everything. Not because the merge itself changed
          # code — it may be pure prose — but because this is the first time
          # this tree is tested *as main*, and the thing it is protecting
          # against is an earlier merge that broke something nobody has run
          # since. Narrowing that by diff would defeat the point of it.
          echo "push to $GITHUB_REF_NAME — running everything"
          code=true
        elif ! git cat-file -e "$BASE" 2>/dev/null; then
          # No usable base commit — a force push, or a shallow fetch that did
          # not reach it. `git diff` would fail here and print nothing, and an
          # empty diff is indistinguishable from "only prose changed", so this
          # would silently skip every test. The safe answer is to run them.
          echo "base commit $BASE is not present — running everything"
          code=true
        else
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|*.md|LICENSE|LICENSE.*|*.png|*.jpg|*.gif|*.svg) ;; # prose
              *) code=true; break ;;
            esac
          done <<<"$(git diff --name-only "$BASE"...HEAD)"
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "changed files are $([ "$code" = true ] && echo 'code — full run' || echo 'prose only — skipping the code jobs')"

  test:
    name: Build and test
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'
      with:
        # The corpus guard compares against a commit, so it needs the
        # history that commit is in. Nothing else in this job does.
        fetch-depth: 0
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.code == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - run: go build ./...
      if: needs.changes.outputs.code == 'true'
    - run: go test -race ./...
      if: needs.changes.outputs.code == 'true'
    # And the one test that does not want the race detector, run without it.
    #
    # TestNoDialectCombinationPanics was 525s of the 649s the step above spent
    # testing the whole module, and 99.8% of the CPU its own package used. It
    # is a recover()-based panic sweep over pure parsing, so instrumentation
    # cannot make it catch a panic it was not already catching; measured on
    # this runner it just costs 4.7x — 89s against 19s for the same 32
    # vectors. The step above still runs it as a concurrency probe — every
    # vector, a window of the corpus — and this step is the sweep itself, over
    # the whole corpus, which is what proves no dialect combination can crash
    # the parser.
    #
    # Sharded across the two operating systems this job already runs on, half
    # the vectors each. The answer is a property of the parser rather than of
    # the platform, so running the whole sweep twice bought nothing while one
    # leg waited for the other.
    #
    # Half each, rather than all of it on whichever leg looks idle, because
    # which leg that is does not hold still. Measured across runs: the Linux
    # leg is steady, 90s of interp and 206s of instrumented tests twice within
    # a second of each other, while macOS moved 1.5x in an hour, 110s of interp
    # against 167s. Handing macOS the whole sweep was tried on this branch and
    # timed: it took 59s off the Linux leg and landed on a macOS runner having
    # a slow day, which cost more than the split had saved.
    #
    # An expression and not a second matrix dimension on purpose: the required
    # checks are named `Build and test (ubuntu-latest)` and `(macos-latest)`,
    # and another matrix key renames both — a required check reporting under a
    # name protection is not waiting for is pending forever, which is the trap
    # `changes` exists to avoid.
    - name: The dialect-combination sweep, without the race detector
      if: needs.changes.outputs.code == 'true'
      env:
        SH_DIALECTCOMBO_SHARD: ${{ matrix.os == 'ubuntu-latest' && '0/2' || '1/2' }}
      run: go test ./syntax -run TestNoDialectCombinationPanics
    # Deliberately a step of an already-required job rather than a job of its
    # own. A new job would have to be added to branch protection to gate
    # anything, and until every open branch carried this workflow the new
    # required check would never run on them — reporting as pending forever
    # rather than as passed, which is the trap `changes` exists to avoid.
    #
    # Only on Linux: the answer is a property of the commit, not of the
    # platform, so asking twice would only make it possible for the two to
    # disagree.
    - name: Has the corpus lost a case?
      if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
      env:
        # A pull request is checked out as the merge of head into base, so
        # base is contained in HEAD and every case that was on main has to
        # still be here. That grades the tree that would land, which is
        # exactly where a merge drops a case. A push to main compares against
        # what main was. Either can be absent, and the guard falls back to a
        # merge base rather than skipping.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: go run ./internal/cmd/corpusguard -base "$BASE"
    # The boundary, tried from outside the process against the binary this
    # job just built. A step of the same already-required job for the reason
    # given above, and unlike the corpus guard it runs on **both** platforms:
    # what the gate is asked is portable, but what the kernel does underneath
    # it is not — the resolving walk uses O_SEARCH on Darwin and
    # O_PATH|O_DIRECTORY on Linux, the two disagree about which errno an
    # O_NOFOLLOW on a link gives, and the link budget is 32 against 40. A
    # sweep on one of them says nothing about the other.
    #
    # It gates, where the other report targets do not. A conformance number
    # is meant to be low and climbing, so failing on it would mean failing on
    # unfinished work; a boundary is meant to hold, so a route that got out
    # is a regression by definition. The sweep is 1.8s and launches the shell
    # a few hundred times, which is cheap enough to ask on every commit.
    - name: Does anything get out of the sandbox?
      if: needs.changes.outputs.code == 'true'
      run: make sandbox

  oracle:
    name: Oracle (report only)
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.code == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - name: Install as much of the panel as this runner can host
      if: needs.changes.outputs.code == 'true'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dash ksh zsh
    - name: Report drift without failing on it
      if: needs.changes.outputs.code == 'true'
      # Report-only, and now for a measured reason rather than an assumed
      # one. The golden record is generated on one machine and a runner does
      # not have the same builds of the same shells: on this runner, against
      # a record made on macOS, **380 of 1122 cases differ** and bash 3.2 is
      # not installable at all. Making this blocking would fail every build,
      # which is the flakiness a gate must not have, and a check that is red
      # for a legitimate reason is one people learn to ignore.
      #
      # The half that *can* block does, and it blocks somewhere else. Whether
      # the corpus, the golden record and the rendered measurements agree
      # with each other needs no shells and has the same answer on every
      # machine, so it is a test — TestTheCommittedRecordAndDocumentAgree —
      # and runs in the required Build and test job. That is what catches a
      # case added, removed or renamed without regenerating, and prose edited
      # after the regeneration.
      #
      # What is left here is the one question only a panel can answer, and
      # only a panel that matches the record can answer it: `make check`
      # locally.
      run: go run ./internal/cmd/oracle -check || true
