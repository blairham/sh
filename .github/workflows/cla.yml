name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  # write, not read: the action stores signatures on a branch of this
  # repository, so it has to create and update `cla-signatures`. With read it
  # fails with "Resource not accessible by integration" and then reports the
  # committer as unsigned, which blocks every pull request including the
  # owner's.
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor Licence Agreement
    runs-on: ubuntu-latest
    steps:
      - name: Require a signed CLA
        # Signatures are recorded in a branch of this repository, so the
        # record lives with the project rather than with a third party.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/blairham/sh/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          allowlist: 'blairham,dependabot[bot]'
          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged, please read
            [CLA.md](https://github.com/blairham/sh/blob/main/CLA.md) and sign
            by commenting exactly:
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA'
