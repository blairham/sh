repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  # Go hygiene, at commit time. This repository had none of it, so a
  # formatting slip or an untidy go.mod was only caught by CI — minutes later,
  # on a different machine, for something the editor could have fixed.
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # `golangci-lint-fmt` applies every formatter configured in .golangci.yml —
  # gofumpt and goimports both.
  #
  # `golangci-lint` and not `golangci-lint-full`: this runs on every commit and
  # should report what you just wrote, not the repository's whole backlog. The
  # choice costs nothing either way — `pass_filenames` is false, so golangci
  # type-checks the whole module regardless and `--new-from-rev` only filters
  # what it prints. It is about the signal, not the second.
  #
  # `--new-from-rev HEAD` compares the *working tree* against HEAD, so it is
  # exactly right locally — it reports what you are about to commit, and
  # `--fix` in the upstream entry corrects it in place — and reports nothing at
  # all on a runner, where the checkout is clean. That is not a subtle failure:
  # measured on a committed errcheck violation, the hook passes while
  # `golangci-lint run` reports two issues on the same tree. CI skips this hook
  # and runs the `golangci-lint-new` alias below instead.
  #
  # Keep `rev` in lockstep with go.mod's tool pin.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint-fmt
      - id: golangci-lint

      # The same upstream hook, told which base to diff against and told not
      # to fix. Both flags are appended to the entry, and both override it
      # (measured):
      #
      #   `--new-from-merge-base` beats the entry's `--new-from-rev HEAD`,
      #   which on a clean checkout compares the tree against an identical
      #   HEAD and so finds nothing.
      #
      #   `--fix=false` beats the entry's `--fix`. This one is not a
      #   preference. Measured on a committed misspelling: with `--fix`,
      #   golangci-lint repaired the runner's working copy, printed
      #   `0 issues` and exited 0 — a green check, nothing reported, and the
      #   committed code still wrong. Fixing belongs to the hook above, which
      #   runs against your working tree where the repair is the point. CI
      #   only reports.
      #
      # `stages: [manual]` keeps it out of every local commit. CI asks for
      # this one by name.
      - id: golangci-lint
        alias: golangci-lint-new
        name: golangci-lint (issues this change introduces)
        stages: [manual]
        args: [--new-from-merge-base=origin/main, --fix=false]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.2.0
    hooks:
      - id: check-license-headers
        args: [--license, Apache-2.0]
      # go.mod's `go` directive and .tool-versions' golang pin must match.
      - id: check-go-version-sync
