# `pre-commit install` wires both hook types, so the pre-push hook below is
# installed by the same command everyone already runs. Without this key a
# plain `install` writes only .git/hooks/pre-commit and the push-stage hook
# is configured but never fires -- silent in the green direction, which is
# the failure mode #1495 and #2150 were both about.
# Every other hook here is a *commit* hook and nothing more. Without this key
# pre-commit's default is "run at every stage", so each one would run a second
# time on every push -- gofumpt, gitleaks and the rest re-doing at push exactly
# what they already passed at commit. The golangci-lint hook below opts back
# out with an explicit `stages:`.
default_stages: [pre-commit]

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These two rewrite in place, so they are the hooks that can still
      # change a file between `make check` and the commit object — the window
      # #1267 is about. The generated record is held out of both: it has to be
      # byte-for-byte what `make oracle` wrote, and a hook tidying it would
      # desync it from the corpus that generated it. Measured, neither hook
      # changes either file today; the exclusion makes that a property rather
      # than a coincidence of how the generator happens to format.
      - id: trailing-whitespace
        exclude: ^(internal/oracle/testdata/golden\.json|docs/spec/measurements\.md)$
      - id: end-of-file-fixer
        exclude: ^(internal/oracle/testdata/golden\.json|docs/spec/measurements\.md)$
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  # Go hygiene, at commit time. This repository had none of it, so a
  # formatting slip or an untidy go.mod was only caught by CI — minutes later,
  # on a different machine, for something the editor could have fixed.
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo
      # gofumpt, back on the commit path. #1495 removed `golangci-lint-fmt`,
      # which was what applied it, and said `go-fumpt-repo` would carry it —
      # and no such hook had ever been in this file, so from that commit until
      # #1903 there was no formatter here at all.
      #
      # `my-cmd-repo` and not `go-fumpt-repo`, because that hook shells out to
      # a `gofumpt` on PATH and this repository does not have one: the
      # formatter is pinned in go.mod's `tool` block and run as `go tool
      # gofumpt`, which is the only way the hook, `make fmt` and the Lint job
      # are guaranteed to be the same gofumpt. A system install would be some
      # other version, and a formatter that disagrees with CI is worse than
      # none.
      #
      # `-l -d` and not `-w`: it reports, it does not rewrite. An autofixing
      # hook reopens the window #1267 is about — a file changing between the
      # `make check` that was run and the commit object that lands — and the
      # fix here is cheap, since `make fmt` is the first thing `make check`
      # does.
      - id: my-cmd-repo
        alias: gofumpt
        name: gofumpt
        args: [--hook:error-on-output, go, tool, gofumpt, -l, -d, .]

  # golangci-lint is not on the *commit* path and stays off it. It type-checks
  # the whole module -- 77 packages, 657k lines -- and measured on this
  # repository that is ~3GB resident and 300% CPU per run; with several
  # worktrees committing at once it took an 18-core machine to a load average
  # of 89 and made the editor unusable. Capping it to 4 workers helped (240MB,
  # 115%) but a linter has no business costing that at `git commit` time.
  #
  # It runs at **push** instead. That is the same work against a much smaller
  # denominator: agents commit constantly across worktrees and push once or
  # twice per pull request. The cost here is loading and typechecking the
  # package graph, and that does not shrink by touching fewer files -- so the
  # lever is how *often* it is paid, never how much of the tree it covers.
  # Scoping to changed packages was considered and rejected for the same
  # reason: it keeps the load and loses the coverage.
  #
  # **`unused` is the one linter held back**, and for correctness rather than
  # for time. It is whole-program reachability, so it is both the most
  # expensive of the seven and the only one whose answer depends on packages
  # you did not touch. CI runs it over the whole tree, which is the only place
  # it can be right.
  #
  # Not `--fast-only`. Of the seven linters enabled in .golangci.yml only
  # ineffassign and misspell carry golangci's `fast` tag, and misspell already
  # has a hook of its own below -- so `--fast-only` would buy ineffassign alone
  # in exchange for loading all 77 packages. Once the load is paid, running
  # errcheck, govet, staticcheck and forbidigo on top of it is nearly free.
  #
  # **This does not replace the Lint job and must not be allowed to.** CI runs
  # the full set over the whole tree and is the required check. A hook can be
  # skipped with `--no-verify`, can be left uninstalled, and never runs on
  # `main` at all -- and a lint that never examines `main` is exactly how five
  # findings accumulated unreported (#1302, #1640). This is early warning,
  # roughly two minutes ahead of CI; the Lint job is the gate.
  #
  # `types: [go]` comes from the hook's manifest, so a docs-only push skips it
  # without a filter here.
  #
  # **The formatters it used to apply are covered above, and were not for a
  # year.** `golangci-lint-fmt` applied gofumpt and goimports, the change that
  # removed it said they would go on running "through go-fumpt-repo above",
  # and no such hook had ever been in this file — so from #1495 until #1903
  # there was no formatter on the commit path at all. The gofumpt hook in the
  # block above is that hook; goimports is not separately covered, because
  # gofumpt is a superset of gofmt and the import *grouping* rule is a
  # golangci-lint formatter setting the Lint job applies.
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: my-cmd-repo
        alias: golangci-lint
        name: golangci-lint (whole tree, minus unused)
        stages: [pre-push]
        args: [go, tool, golangci-lint, run, -D, unused]

  # US English over prose, which is where most of this repository is.
  # `.golangci.yml` sets `locale: US` and AGENTS.md cites it as enforced, but
  # golangci-lint reaches Go files and nothing else, so every `.md` under
  # docs/ was outside the rule it is cited for — #541 found British spellings
  # sitting in the spec with the linter green. The Go half stays where it is;
  # this is the other half.
  #
  # Report-only — no `-w`. Unlike gofumpt above, misspell *can* reach the
  # inside of a string, so an autofixing pass here could rewrite the text of a
  # recorded measurement or a corpus snippet, which is exactly the class of
  # change #1267 is about. The generated record is held out as well, for the
  # same reason the two rewriting hooks above hold it out.
  #
  # Two words are exempt, and neither is prose. `colour` is one shell's
  # parameter *name* — `.golangci.yml` says why at more length — and
  # `cancelled` is the Agent Client Protocol's spelling of a `stopReason`,
  # already carrying a `//nolint:misspell` at each of its five sites in Go.
  # The prose in docs/design/acp.md is about that value, and a corrected
  # sentence beside an uncorrected literal reads worse than either.
  - repo: https://github.com/golangci/misspell
    rev: v0.8.0
    hooks:
      - id: misspell
        args: [-locale, US, -i, "colour,cancelled", -error]
        files: \.(md|ya?ml)$
        exclude: ^docs/spec/measurements\.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.4.0
    hooks:
      - id: check-license-headers
        args: [--license, Apache-2.0]
      # go.mod's `go` directive and .tool-versions' golang pin must match.
      - id: check-go-version-sync
      # Replaces upstream's check-merge-conflict, which missed a diff3 base
      # marker that lived in docs/spec/semantics.md until an audit found it by
      # eye. Upstream knows only the three markers of the default conflict
      # style, and scans only while a merge is in progress — so it cannot see a
      # marker that was already committed, which is the only kind still here.
      - id: check-conflict-markers
      # Known vulnerabilities in code this module actually calls, from Go's
      # own database. It runs here and not on every commit because the answer
      # can only change when the module graph does — the hook's own default is
      # to watch go.mod and go.sum, and that is left as it is.
      #
      # It is worth saying what this does not cover, so nobody reads a green
      # commit as more than it is: an advisory published while nobody is
      # committing is invisible to a commit hook, and belongs to CI on a
      # schedule. This catches the case a person can act on — a dependency
      # arriving or moving — at the moment they are choosing it.
      #
      # It is quiet enough to sit here because it is symbol-aware. Measured on
      # a module pinned to a vulnerable x/text, it reported 29 findings across
      # imported packages and required modules and failed on the one the code
      # reached. A manifest scanner would have failed that commit 29 times,
      # and a hook that cries wolf is a hook that gets disabled.
      - id: go-vulncheck
