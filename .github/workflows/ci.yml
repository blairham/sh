name: CI

on:
  pull_request:
    # `synchronize` is every push to a branch with an open pull request, which
    # is the feedback that matters — but only once the change is meant to be
    # looked at. A draft is work in progress, so nothing here runs for one;
    # `ready_for_review` starts it, and until then the local hooks are the
    # feedback. That is the whole trade: push freely while drafting, and the
    # gate runs when you say it is ready.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# Gating is done inside the jobs rather than with a `paths:` filter on the
# workflow, and the difference matters: a required check that never runs is
# reported as *pending forever*, not as passed, so a paths-filtered required
# check makes a docs-only pull request unmergeable. The jobs therefore always
# run and report; only the expensive steps are skipped.
jobs:
  # Pre-commit runs for every pull request, draft or not, and everything else
  # waits on it. It is also where linting happens: `golangci-lint-full` covers
  # the whole module, so there is no separate lint job to keep in step. It is the only job that looks at *every* file rather than at
  # Go: trailing whitespace, licence headers, secrets, the toolchain pin. None
  # of that is worth detecting changes for, and a secret committed to a draft
  # is committed.
  #
  # The hook environments are cached. pre-commit builds an environment for a
  # hook even when SKIP tells it not to run one, which cost two and a half
  # minutes a build to install a linter this job then declines to use.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
    - name: Cache the hook environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit hooks
      # Nothing is skipped. `golangci-lint-full` lints the whole module here,
      # which is what a separate lint job used to do — badly, in the sense
      # that it spent two minutes on setup to run something that takes under
      # a second.
      #
      # check-license-headers is a golang-language hook, so pre-commit builds
      # it here; the version it runs is the `rev` pinned in
      # .pre-commit-config.yaml, which stays the single source of truth.
      uses: blairham/go-pre-commit@v4.6.6

  # Only after the cheap universal checks have passed is it worth asking the
  # expensive question.
  changes:
    name: Detect changed files
    needs: pre-commit
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: filter
      name: Did anything Go change?
      run: |
        base="origin/${{ github.base_ref }}"
        if git diff --name-only "$base"...HEAD | grep -qE '(\.go|^go\.mod|^go\.sum)$'; then
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "Go files changed — building and testing."
        else
          echo "go=false" >> "$GITHUB_OUTPUT"
          echo "No Go files changed — build, test and lint will be skipped."
        fi

  # `go vet` is not run here: govet is one of the linters .golangci.yml
  # enables, so the Lint job already does it, over the same code, with the
  # same analysers. Running it twice cost a minute a build and found nothing
  # the other did not.
  test:
    name: Build and test
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.go == 'true'
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.go == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
    - run: go build ./...
      if: needs.changes.outputs.go == 'true'
    - run: go test -race ./...
      if: needs.changes.outputs.go == 'true'

  oracle:
    name: Oracle (report only)
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.go == 'true'
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.go == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Install as much of the panel as this runner can host
      if: needs.changes.outputs.go == 'true'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dash ksh zsh
    - name: Report drift without failing on it
      if: needs.changes.outputs.go == 'true'
      # The golden record is generated on one machine and a runner does not
      # have the same builds of the same shells, so some differences here are
      # legitimate. A check that is red for a legitimate reason is one people
      # learn to ignore. `make oracle-check` is the gate locally, where the
      # panel matches the record.
      run: go run ./cmd/oracle -check || true
