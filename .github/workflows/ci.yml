name: CI

# One workflow holds everything that gates a merge, so there is one file to
# read and one check to require. Splitting pre-commit or tests into their own
# workflow bought nothing and cost a second place to keep in sync.
on:
  pull_request:
    # `synchronize` is every push to a branch with an open pull request, which
    # is the feedback that matters. A draft is treated exactly like any other
    # pull request: the distinction bought a little runner time and cost a
    # second set of rules to hold in your head.
    types: [opened, reopened, synchronize, ready_for_review]
    # Nothing here fires for a push to a branch with no pull request open, so
    # branch pushes cost nothing at all.
  push:
    # A merge runs the same full set a pull request runs — pre-commit, tests,
    # oracle, no change detection. Protection makes the tree that lands the
    # tree that was tested, so this is not about the merge; it is about
    # whether main still works after everything that reached it, including
    # merges that landed after this branch was last rebased and were never
    # tested together. That is the only run that can catch it.
    branches: [main]
  # The report-only jobs below do not run on a pull request any more, so this
  # is what keeps them running on a tree nobody has merged to in a while.
  # 07:00 UTC, which is before the working day here and well clear of the
  # merge traffic that would otherwise be competing for runners.
  schedule:
  - cron: '0 7 * * *'
  # On demand, on any ref. The report-only jobs below are skipped on a pull
  # request, so **the job that would exercise a change to one of them does not
  # run on the pull request that makes it** -- which is the whole reason
  # #3480's bash column and #3082's containment have both been described,
  # measured and then not landed: the only instrument that could say whether
  # the change worked first ran after the squash. This costs nothing on an
  # ordinary pull request and turns "land it and watch main" into "push the
  # branch, dispatch it against that branch, read the job".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded push to a pull request is not worth finishing; only the
  # newest commit on that branch matters, so its run replaces the one before.
  #
  # A push to main is the opposite case. main is not a branch anyone is
  # iterating on: every merge is a *different* change, and the run it starts
  # is the only verification that commit will ever get — the pull request was
  # tested against its merge base, not against the tree the squash produced.
  # Canceling it discards the answer rather than a stale one. Keying main's
  # group on the commit gives every merge a group of its own, so there is
  # nothing to cancel it and nothing for it to queue behind; a pull request
  # ref is already unique per pull request, so it keeps superseding itself.
  #
  # A dispatch is the same case as a merge for the same reason: it is a
  # deliberate request for an answer about one ref, and two of them in a row
  # are two samples rather than one superseding the other. Keyed on the run,
  # so repeated dispatches of the same branch -- which is how an intermittent
  # report-only job gets measured at all -- do not cancel each other.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'workflow_dispatch' && github.run_id || 'pr' }}
  cancel-in-progress: true

jobs:
  # Runs for every commit that reaches GitHub — every push to a pull request,
  # draft or not, and every push to main. It is the only job that looks at
  # *every* file rather than at Go: trailing whitespace, license headers,
  # secrets, the toolchain pin. None of that is worth detecting changes for,
  # and a secret committed to a draft is committed.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true # go-mod-tidy-repo resolves the whole graph; an uncached run is slow and flaky # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
    - name: Run pre-commit hooks
      # golangci-lint is among these hooks again, scoped with
      # --new-from-rev HEAD so a developer is shown what the commit
      # introduces. The Lint job below is the unscoped, whole-tree run and
      # is the required check -- see its comment for why it is not scoped.
      uses: blairham/go-pre-commit@v4.6.6

  # golangci-lint, in a job of its own, because it does not belong at `git
  # commit` time: it type-checks the whole module and cost ~3GB and 300% CPU
  # per run on a developer's machine.
  #
  # **The whole tree, every run.** This used to be `--new-from-merge-base`, so
  # that a pull request was graded on its own diff and not blocked by debt it
  # did not introduce. The cost of that was invisible in exactly the direction
  # that matters: on `main` the merge base *is* HEAD, so the diff is empty and
  # the run examines nothing, and from the moment a finding lands through a
  # merge nothing reports it ever again. Five accumulated that way and were
  # found by hand rather than by CI (#1640), and a linter that failed on a
  # clean checkout for reasons that were nobody's is what taught people to
  # discount it (#1302).
  #
  # A diff-scoped run also fails silently in the green direction. golangci-lint
  # prints `0 issues` and exits 0 when the base ref does not resolve -- a
  # shallow clone, a renamed base -- so the check that is meant to be strictest
  # is the one that passes when it is broken. A full-tree run has no such mode:
  # it either examines the tree or it errors.
  #
  # What this trades away is that inherited debt now does block a pull request.
  # That is affordable only because the tree is clean, and keeping it clean is
  # the point; if a finding lands anyway, the answer is to fix it rather than
  # to narrow the run again.
  #
  # No `fetch-depth: 0` any more: nothing here computes a merge base, so the
  # default shallow checkout is enough and is faster.
  #
  # Gated per step, never on the job, for the same reason `test` is: this is a
  # required check, and a required check that never runs is reported as
  # *pending forever* rather than as passed, which would make a docs-only pull
  # request unmergeable. So the job always runs and always reports, and only
  # the expensive steps are skipped when nothing but prose changed.
  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.code == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - name: Is the whole tree clean?
      if: needs.changes.outputs.code == 'true'
      run: go tool golangci-lint run

  # Gating happens inside the jobs, never with a workflow-level `paths:`
  # filter: a required check that never runs reports as *pending forever*
  # rather than as passed, which makes a docs-only pull request unmergeable.
  # Anything unrecognized counts as code, so when this is wrong it is wrong in
  # the direction of running the tests.
  # This used to wait on pre-commit, on the reasoning that the expensive
  # question is not worth asking until the cheap universal checks have passed.
  # That reasoning is about runner minutes, and it was paid for in wall clock
  # on every run: `changes` is 23s of `git diff --name-only` and pre-commit is
  # 47s, and chaining them put 70s in front of the 516s job that is the whole
  # critical path. Measured on main, the three stages summed to 586s against a
  # 585s average — the chain *was* the overhead, all of it.
  #
  # Unchained, the two run together and `test` starts when the diff is known,
  # at 23s rather than 70s. What that gives up is that a branch failing
  # pre-commit now also spends a runner on change detection, which is 23s of
  # ubuntu against 47s saved on every run that passes — and nearly all of them
  # pass.
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
    # Gated per step, not on the job. A required check that never runs is
    # reported as pending forever, and a matrix job skipped by `if:` never
    # expands at all — so the job always runs and reports, and only the
    # expensive steps are skipped.
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # the diff needs the base commit, not just HEAD
    - id: filter
      name: Is any of this code?
      env:
        # A pull request diffs against its base; a push to main diffs against
        # what main was before it. Either can be missing — a force push, a
        # first commit — and the fallback below covers that.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=false
        # Packaging is gated on the packaging files alone, and deliberately
        # does **not** take the "a merge runs everything" branch below. That
        # reasoning is about code an earlier merge may have broken; the
        # release config has no such drift — it either renders or it does
        # not, and a merge that did not touch it cannot change the answer.
        # Forcing it on would put the cross-build matrix on every merge, on a
        # repository that merges all day.
        packaging=false
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          # A merge runs everything. Not because the merge itself changed
          # code — it may be pure prose — but because this is the first time
          # this tree is tested *as main*, and the thing it is protecting
          # against is an earlier merge that broke something nobody has run
          # since. Narrowing that by diff would defeat the point of it.
          echo "push to $GITHUB_REF_NAME — running everything"
          code=true
        fi
        # The base check is its own branch rather than an `elif`, because
        # `packaging` is still undecided after the merge case above and the
        # diff is the only thing that can decide it.
        if ! git cat-file -e "$BASE" 2>/dev/null; then
          # No usable base commit — a force push, a shallow fetch that did not
          # reach it, or a `workflow_dispatch`, which has no before-commit at
          # all. `git diff` would fail here and print nothing, and an empty
          # diff is indistinguishable from "nothing relevant changed", so this
          # would silently skip everything. The safe answer is to run it.
          #
          # For packaging this is also the hand-operated route in: the report
          # of a dispatch against a branch is how a change to this job gets
          # exercised before it lands, per `workflow_dispatch` above.
          echo "base commit $BASE is not present — running everything"
          code=true
          packaging=true
        else
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|*.md|LICENSE|LICENSE.*|*.png|*.jpg|*.gif|*.svg) ;; # prose
              *) code=true ;;
            esac
            # The release config, the workflow that runs it, and this file —
            # which is where the rendering job itself is written, so a change
            # to the job exercises the job.
            case "$f" in
              .goreleaser.yaml|.github/workflows/release.yml|.github/workflows/ci.yml) packaging=true ;;
            esac
          done <<<"$(git diff --name-only "$BASE"...HEAD)"
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "packaging=$packaging" >> "$GITHUB_OUTPUT"
        echo "changed files are $([ "$code" = true ] && echo 'code — full run' || echo 'prose only — skipping the code jobs')"
        echo "packaging files $([ "$packaging" = true ] && echo 'changed — rendering a release' || echo 'untouched — skipping the render')"

  test:
    name: Build and test
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'
      with:
        # The corpus guard compares against a commit, so it needs the
        # history that commit is in. Nothing else in this job does.
        fetch-depth: 0
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.code == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - run: go build ./...
      if: needs.changes.outputs.code == 'true'
    # The race detector on one leg, not both.
    #
    # macOS was the long pole and `-race` was why: 326s of its 516s against
    # 252s of Ubuntu's 434s, for an answer that is a property of the Go memory
    # model rather than of the platform. Running it twice bought a second
    # opinion on the same question while the required check everybody waits on
    # was pinned to the slower of the two runners.
    #
    # macOS still runs every test in the module, uninstrumented. That is the
    # half that matters for this leg: the failures we have actually had here
    # were platform behavior — a timing-sensitive pty read, a signal
    # delivered differently — and every one of them is still exercised. What
    # moves to Ubuntu alone is the detector, which had no platform-specific
    # finding to its name.
    #
    # The uninstrumented leg skips the dialect-combination sweep, and that is
    # not a coverage decision: `Dialect sweep` is two jobs that run exactly
    # that test over exactly that corpus, sharded in halves, and they run
    # beside this one rather than behind it. Measured on run 35320633395, the
    # whole of `syntax` was 237.5s on the macOS leg and 0.75s of that is the
    # rest of the package — so this leg was paying 236s on the critical path
    # for an answer two other jobs had already finished producing. The Linux
    # leg keeps it, because under -race it is the *other* property — whether
    # concurrent parses share state -- over a window of the corpus rather than
    # the sweep, and that costs 43s rather than 237s.
    #
    # TestTheSweepIsProvedWhereThisLegStopsPayingForIt is what keeps the skip
    # honest: it reads this file, and fails if the shards that answer for the
    # whole of it stop covering the whole of it.
    - name: Run the tests, with the race detector on the Linux leg
      if: needs.changes.outputs.code == 'true'
      run: go test ${{ matrix.os == 'ubuntu-latest' && '-race' || '-skip=^TestNoDialectCombinationPanics$' }} ./...
    # Deliberately a step of an already-required job rather than a job of its
    # own. A new job would have to be added to branch protection to gate
    # anything, and until every open branch carried this workflow the new
    # required check would never run on them — reporting as pending forever
    # rather than as passed, which is the trap `changes` exists to avoid.
    #
    # Only on Linux: the answer is a property of the commit, not of the
    # platform, so asking twice would only make it possible for the two to
    # disagree.
    - name: Has the corpus lost a case?
      if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
      env:
        # A pull request is checked out as the merge of head into base, so
        # base is contained in HEAD and every case that was on main has to
        # still be here. That grades the tree that would land, which is
        # exactly where a merge drops a case. A push to main compares against
        # what main was. Either can be absent, and the guard falls back to a
        # merge base rather than skipping.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: go run ./internal/cmd/corpusguard -base "$BASE"
    # The same question about share/suite, and for the same reason it is a
    # step rather than a job. It is separate from the corpus guard because
    # the two compare different things — a set of case IDs inside one Go file
    # against a set of paths plus a per-file line floor — and folding them
    # would mean one instrument reporting about two unrelated trees.
    - name: Has our own suite lost a file?
      if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: go run ./internal/cmd/suiteguard -base "$BASE"
    # The boundary, tried from outside the process against the binary this
    # job just built. A step of the same already-required job for the reason
    # given above, and unlike the corpus guard it runs on **both** platforms:
    # what the gate is asked is portable, but what the kernel does underneath
    # it is not — the resolving walk uses O_SEARCH on Darwin and
    # O_PATH|O_DIRECTORY on Linux, the two disagree about which errno an
    # O_NOFOLLOW on a link gives, and the link budget is 32 against 40. A
    # sweep on one of them says nothing about the other.
    #
    # It gates, where the other report targets do not. A conformance number
    # is meant to be low and climbing, so failing on it would mean failing on
    # unfinished work; a boundary is meant to hold, so a route that got out
    # is a regression by definition. The sweep is 1.8s and launches the shell
    # a few hundred times, which is cheap enough to ask on every commit.
    - name: Does anything get out of the sandbox?
      if: needs.changes.outputs.code == 'true'
      run: make sandbox

  # The dialect-combination sweep: a job of its own, so it runs beside the
  # tests rather than after them.
  #
  # TestNoDialectCombinationPanics is a recover()-based panic sweep over pure
  # parsing, so the race detector cannot make it catch a panic it was not
  # already catching; it costs 4.7x under instrumentation and buys nothing.
  # `go test -race ./...` above still runs it as a concurrency probe — every
  # vector, a window of the corpus — and this is the sweep itself, over the
  # whole corpus, which is what proves no combination can crash the parser.
  #
  # It used to be the last step of `Build and test`, and that is where its
  # cost was: a step runs after the steps before it, so the sweep's 117s sat
  # on the critical path behind the 260s `go test` step, in the job every
  # merge waits for. Measured on Ubuntu the job was 443s, of which 377s were
  # those two in a row. As a job it runs alongside instead, and the critical
  # path becomes the longer of the two rather than their sum.
  #
  # The step was a step on purpose, and half of that reason still holds. A
  # new job gates nothing until it is added to branch protection, and a
  # required check that never runs reports as pending forever rather than as
  # passed. What this file can do about that it does: the job always runs and
  # always reports — only its steps are gated on `changes`, exactly as `test`
  # is — so a docs-only pull request gets a green check rather than a missing
  # one.
  #
  # What this file cannot do is the other half. A pull request whose last run
  # predates this job has no `Dialect sweep` check at all, and nothing here
  # will produce one until that branch runs again; making the check required
  # strands every such branch until it does. That is a property of the order
  # in which protection and open branches change, not of this workflow, so
  # adding a required check here means re-running the open pull requests.
  #
  # Both halves on Linux. The answer is a property of the parser rather than
  # of the platform, and the macOS runner's speed does not hold still — it
  # moved 1.5x in an hour when this was measured — so a shard on it would make
  # this job's duration the least predictable thing in the workflow.
  sweep:
    name: Dialect sweep
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/2', '1/2']
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.code == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - name: Can any dialect combination crash the parser?
      if: needs.changes.outputs.code == 'true'
      env:
        SH_DIALECTCOMBO_SHARD: ${{ matrix.shard }}
      run: go test ./syntax -run TestNoDialectCombinationPanics

  packaging:
    name: Render a release
    needs: changes
    runs-on: ubuntu-latest
    # Not report-only. `.goreleaser.yaml` is otherwise exercised for the first
    # time by the release workflow, which runs on a `v*` tag -- so a mistake in
    # it fails at the **last** step of a release, with every artifact built and
    # the tag already public. The file's own `changelog:` comment records one
    # that would have: 188,381 characters of release body against GitHub's
    # 125,000 limit, measured at v0.0.0. Nothing before the tag could have said
    # so. This is what says so.
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.packaging == 'true'
      with:
        # GoReleaser reads the tag history to build a changelog, and the
        # `changelog:` gate is `eq .PreviousTag ""` -- so a shallow checkout
        # would render the one case the config special-cases and never the
        # ordinary one.
        fetch-depth: 0
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.packaging == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    # `--snapshot` stands in for a tag and disables publishing on its own;
    # `--skip=publish` says it a second time, because the tap token is the one
    # thing in this config that writes to another repository. No secrets are
    # passed to this step, deliberately: the render must not be able to reach
    # the tap even if both guards were wrong. The formula is still written --
    # to `dist/homebrew/Formula/` -- which is what the next step reads.
    - name: Render a release, and publish none of it
      if: needs.changes.outputs.packaging == 'true'
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --snapshot --clean --skip=publish
    # Rendering proves the config parses and every target builds. It does not
    # prove the formula installs what the archive carries: the install list is
    # an explicit `libexec.install "sh", "bash", …` and `libexec.install`
    # silently skips a name it was not given, which is how `ash` was dropped
    # from a release once already. A formula quietly missing a shell renders
    # exactly like a correct one.
    #
    # So this compares the two rosters the render itself produced -- the
    # binaries in `artifacts.json` against the names in the generated formula
    # -- rather than either against a list written here. A hardcoded list is a
    # claim about a roster it cannot see, and goes stale the next time someone
    # adds a binary; derived, the check gets stronger when one is added.
    - name: Does the formula install every binary the build produced?
      if: needs.changes.outputs.packaging == 'true'
      shell: bash
      run: |
        set -euo pipefail

        formula=$(find dist/homebrew -name '*.rb' -print -quit 2>/dev/null || true)
        # Every check below is written to fail loudly when its input is
        # missing, because the failure this job exists to catch and a job that
        # silently measured nothing look identical in a green tick.
        if [ -z "$formula" ]; then
          echo "::error::no formula under dist/homebrew -- the brew pipe did not run, so this job proved nothing"
          exit 1
        fi
        echo "reading $formula"

        # A scratch directory, so the job leaves nothing in the checkout.
        work=$(mktemp -d)
        built="$work/built.txt"
        installed="$work/installed.txt"

        # `.extra.ID` is the build id, `.name` the binary it produces; the
        # same name appears once per platform, hence the dedupe.
        jq -r '.[] | select(.type == "Binary") | .name' dist/artifacts.json | sort -u > "$built"
        # **Both destinations, not just libexec.** The keg has two on purpose:
        # the shells go to `libexec`, which is off PATH, because a `bash` ahead
        # of `/bin` would answer for every shebang on the machine; `shfmt` goes
        # to `bin`, because nothing resolves a formatter implicitly and one
        # behind `opt_libexec` is a formatter nothing calls. A check that read
        # only `libexec.install` would report the formatter as missing on a
        # keg that installs it correctly -- which is a false alarm, and the
        # failure mode that trains people to ignore the job.
        #
        # Both quoting styles too, since the formula is generated and this
        # should not depend on which one GoReleaser emits.
        sed -n -E 's/.*(libexec|bin)\.install (.*)/\2/p' "$formula" \
          | tr ',' '\n' \
          | sed -n -e 's/.*"\([^"]*\)".*/\1/p' -e "s/.*'\([^']*\)'.*/\1/p" \
          | sort -u > "$installed"

        if [ ! -s "$built" ]; then
          echo "::error::artifacts.json lists no binaries at all -- the render produced nothing to install"
          exit 1
        fi
        if [ ! -s "$installed" ]; then
          echo "::error::the rendered formula has no libexec.install list -- nothing would be installed"
          exit 1
        fi

        echo "built:     $(tr '\n' ' ' < "$built")"
        echo "installed: $(tr '\n' ' ' < "$installed")"

        status=0
        # Built but not installed: the keg comes out missing a binary the
        # archive carries and the caveats name. This is the `ash` failure.
        if missing=$(comm -23 "$built" "$installed") && [ -n "$missing" ]; then
          echo "::error::the archive carries these, and the formula does not install them: $(echo $missing)"
          status=1
        fi
        # Installed but not built: `libexec.install` raises on a name that is
        # not in the archive, so this fails at `brew install` time instead.
        if extra=$(comm -13 "$built" "$installed") && [ -n "$extra" ]; then
          echo "::error::the formula installs these, and the archive does not carry them: $(echo $extra)"
          status=1
        fi
        if [ "$status" -eq 0 ]; then
          echo "the formula installs all $(wc -l < "$built" | tr -d ' ') binaries the build produced"
        fi
        exit "$status"

  oracle:
    name: Oracle (report only)
    needs: changes
    # Report-only, so it cannot fail, so a pull request gains nothing by
    # waiting for it -- and it is not a required check, which is what makes
    # skipping it here safe rather than a check that hangs pending forever.
    # The four report-only jobs were 635s of runner time per run that could
    # not turn a build red; at ~170 runs a day that is ~30 runner-hours daily
    # of output nothing is obliged to read. They run on every merge, where
    # the drift is attributable to one squash, and nightly, which is where
    # anybody actually reads them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.code == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - name: Install as much of the panel as this runner can host
      if: needs.changes.outputs.code == 'true'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dash ksh zsh
    - name: Report drift without failing on it
      if: needs.changes.outputs.code == 'true'
      # Report-only, and now for a measured reason rather than an assumed
      # one. The golden record is generated on one machine and a runner does
      # not have the same builds of the same shells: on this runner, against
      # a record made on macOS, **380 of 1122 cases differ** and bash 3.2 is
      # not installable at all. Making this blocking would fail every build,
      # which is the flakiness a gate must not have, and a check that is red
      # for a legitimate reason is one people learn to ignore.
      #
      # The half that *can* block does, and it blocks somewhere else. Whether
      # the corpus, the golden record and the rendered measurements agree
      # with each other needs no shells and has the same answer on every
      # machine, so it is a test — TestTheCommittedRecordAndDocumentAgree —
      # and runs in the required Build and test job. That is what catches a
      # case added, removed or renamed without regenerating, and prose edited
      # after the regeneration.
      #
      # What is left here is the one question only a panel can answer, and
      # only a panel that matches the record can answer it: `make check`
      # locally.
      run: go run ./internal/cmd/oracle -check || true

  perfgate:
    name: Performance gate (report only)
    needs: changes
    # Report-only, so it cannot fail, so a pull request gains nothing by
    # waiting for it -- and it is not a required check, which is what makes
    # skipping it here safe rather than a check that hangs pending forever.
    # The four report-only jobs were 635s of runner time per run that could
    # not turn a build red; at ~170 runs a day that is ~30 runner-hours daily
    # of output nothing is obliged to read. They run on every merge, where
    # the drift is attributable to one squash, and nightly, which is where
    # anybody actually reads them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Bounded, because the step below cannot fail: `|| true` turns a red gate
    # into a report, and it would turn a wedged one into a job that sits at
    # the default six-hour limit holding a runner. The measurement is about
    # half a minute and `make perfgate` carries its own 30m test timeout, so
    # this is the outer bound on a build that never gets that far.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'
    - uses: actions/setup-go@v6
      if: needs.changes.outputs.code == 'true'
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - name: Install the shells the dialects are graded against
      if: needs.changes.outputs.code == 'true'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dash ksh zsh
    - name: How does each dialect compare with the shell it claims to be?
      if: needs.changes.outputs.code == 'true'
      # #2257: this existed as `make perfgate` and was in no workflow at all,
      # so the promise #1403 encodes -- "no dialect can be slower than the
      # original" -- was checked only when somebody remembered to type it.
      # That is the shape a stale fact survives in, and it is why "perfgate is
      # failing" circulated for a week as hearsay. It runs here now, on every
      # change that touches code, and it costs about half a minute.
      #
      # Report-only, and for a reason that is measured rather than assumed.
      # Three of the four dialects are slower than their originals today and
      # have been since #1403 was closed on 2026-09-08 -- on this runner's
      # ancestors and on the maintainer's machine alike -- so a blocking job
      # would be red on arrival and stay red, which is how a check becomes one
      # people learn to ignore.
      #
      # #2813 changed which rows the bar counts: the workload gates and the
      # bare case is reported. That is what makes report-only a stage rather
      # than a permanent excuse -- the bare column was unwinnable on Linux (an
      # empty Go binary costs more CPU to start than /bin/dash costs to do its
      # whole job), so no amount of work would have turned this job green. The
      # workload column is interpreter throughput and is ours: bash 1.53x, zsh
      # 2.20x on this runner. Those are the numbers that have to come under
      # 1.00x before this line loses its `|| true`.
      #
      # It is deliberately NOT wired as a blocking regression gate yet. The
      # honest form of that is an expectation of which comparisons pass, and
      # every figure this repository has is from one macOS machine; writing a
      # runner's expectations from a machine that is not the runner is the
      # trap this file already documents for the oracle job below. This job is
      # what produces the runner measurements that table would be written
      # from.
      #
      # The half that can block already does, and blocks elsewhere. Whether
      # the gate can bite -- that a slower dialect is caught, that a refusing
      # one is not scored as a pass, that a tie is not a win, that the
      # workload answer is the panel's own -- needs no measurement and has the
      # same answer on every machine, so those are ordinary tests in the
      # required Build and test job. What cannot rot unnoticed here is the
      # machinery; what is reported here is the number.
      run: make perfgate || true
