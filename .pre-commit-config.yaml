repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These two rewrite in place, so they are the hooks that can still
      # change a file between `make check` and the commit object — the window
      # #1267 is about. The generated record is held out of both: it has to be
      # byte-for-byte what `make oracle` wrote, and a hook tidying it would
      # desync it from the corpus that generated it. Measured, neither hook
      # changes either file today; the exclusion makes that a property rather
      # than a coincidence of how the generator happens to format.
      - id: trailing-whitespace
        exclude: ^(internal/oracle/testdata/golden\.json|docs/spec/measurements\.md)$
      - id: end-of-file-fixer
        exclude: ^(internal/oracle/testdata/golden\.json|docs/spec/measurements\.md)$
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  # Go hygiene, at commit time. This repository had none of it, so a
  # formatting slip or an untidy go.mod was only caught by CI — minutes later,
  # on a different machine, for something the editor could have fixed.
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # golangci-lint is NOT run here. It type-checks the whole module on every
  # commit -- measured on this repository, ~3GB resident and 300% CPU per run,
  # and with several worktrees committing at once it took an 18-core machine to
  # a load average of 89 and made the editor unusable. Capping it to 4 workers
  # helped (240MB, 115%) but a linter has no business costing that at `git
  # commit` time.
  #
  # AGENTS.md already said so -- "it runs in CI, not pre-commit -- it's too slow
  # for every commit" -- and this file disagreed with it.
  #
  # **The formatters it used to apply are not covered here, and this file said
  # they were.** `golangci-lint-fmt` applied gofumpt and goimports, the change
  # that removed it said they would go on running "through go-fumpt-repo
  # above", and no such hook has ever been in this file. So since #1495 there
  # has been no formatter on the commit path at all — `make fmt` (which
  # `make check` runs first) and the Lint job are what keep the tree formatted,
  # which is why nothing has drifted. #1903 is the hook itself.
  #
  # CI runs it instead, in the Lint job, diffing from the merge base. That is
  # also the only place it can say anything useful: `--new-from-rev HEAD` on a
  # clean checkout reports nothing at all, so the hook that used to run here was
  # silent on a runner while being expensive on a laptop.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.4.0
    hooks:
      - id: check-license-headers
        args: [--license, Apache-2.0]
      # go.mod's `go` directive and .tool-versions' golang pin must match.
      - id: check-go-version-sync
      # Replaces upstream's check-merge-conflict, which missed a diff3 base
      # marker that lived in docs/spec/semantics.md until an audit found it by
      # eye. Upstream knows only the three markers of the default conflict
      # style, and scans only while a merge is in progress — so it cannot see a
      # marker that was already committed, which is the only kind still here.
      - id: check-conflict-markers
      # Known vulnerabilities in code this module actually calls, from Go's
      # own database. It runs here and not on every commit because the answer
      # can only change when the module graph does — the hook's own default is
      # to watch go.mod and go.sum, and that is left as it is.
      #
      # It is worth saying what this does not cover, so nobody reads a green
      # commit as more than it is: an advisory published while nobody is
      # committing is invisible to a commit hook, and belongs to CI on a
      # schedule. This catches the case a person can act on — a dependency
      # arriving or moving — at the moment they are choosing it.
      #
      # It is quiet enough to sit here because it is symbol-aware. Measured on
      # a module pinned to a vulnerable x/text, it reported 29 findings across
      # imported packages and required modules and failed on the one the code
      # reached. A manifest scanner would have failed that commit 29 times,
      # and a hook that cries wolf is a hook that gets disabled.
      - id: go-vulncheck
