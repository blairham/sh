repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  # Go hygiene, at commit time. This repository had none of it, so a
  # formatting slip or an untidy go.mod was only caught by CI — minutes later,
  # on a different machine, for something the editor could have fixed.
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # `golangci-lint-fmt` applies every formatter configured in .golangci.yml —
  # gofumpt and goimports both.
  #
  # `golangci-lint-full` and not `golangci-lint`: the latter runs
  # `--new-from-rev HEAD`, and upstream's own description says linters that
  # scan the whole module, like `unused`, "won't work as expected" under it.
  # The full hook is the one upstream tells you to use when pre-commit runs in
  # CI, and it is what makes a separate lint job unnecessary. It costs under a
  # second on a warm cache, so there is nothing to trade away.
  #
  # Keep `rev` in lockstep with go.mod's tool pin.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint-fmt
      - id: golangci-lint-full

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.2.0
    hooks:
      - id: check-license-headers
        args: [--license, Apache-2.0]
      # go.mod's `go` directive and .tool-versions' golang pin must match.
      - id: check-go-version-sync
